name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s skill-src/tests -p "test_*.py" -v
      - run: node --test skill-src/tests/test_browser.js skill-src/tests/test_login.js
      - run: powershell -NoProfile -File skill-src/tests/test_network.ps1
      - run: python skill-src/scripts/webvpn_url.py --selftest
